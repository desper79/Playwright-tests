# ============================================
# COMMON CONFIGURATION
# ============================================

# Playwright Configuration
playwright.timeout=30000
playwright.retries=2
playwright.video.enabled=false
playwright.trace.enabled=false
playwright.slowMo=0

# API
api.jsonplaceholder.url=https://jsonplaceholder.typicode.com

# Logging
logging.level=INFO
logging.format=text

# Default browser (chromium, firefox, webkit, chrome, msedge)
playwright.browser=chromium